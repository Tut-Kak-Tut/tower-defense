<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Серце Підземелля</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <h1>Серце Підземелля</h1>
      <div class="stat souls" title="Душі — платиш ними за монстрів">👻 <span id="money"></span></div>
      <div class="stat heart" title="Міцність Серця">💜 <span id="lives"></span></div>
      <div class="stat raid" title="Набіг">⚔️ <span id="wave"></span></div>
    </header>

    <main>
      <div id="board">
        <canvas id="game" width="800" height="480"></canvas>
        <div id="overlay" class="hidden">
          <div class="panel">
            <h2 id="overlayTitle"></h2>
            <p id="overlayText"></p>
            <button id="restartBtn" class="primary">Грати знову</button>
          </div>
        </div>
      </div>

      <aside id="sidebar">
        <section>
          <h3>Монстри</h3>
          <div id="towerList"></div>
        </section>

        <section id="info" class="hidden">
          <h3 id="infoName"></h3>
          <p id="infoStats"></p>
          <button id="upgradeBtn"></button>
          <button id="sellBtn" class="danger"></button>
        </section>

        <section>
          <button id="waveBtn" class="primary"></button>
          <div class="row">
            <button id="speedBtn"></button>
            <button id="pauseBtn"></button>
          </div>
        </section>

        <section class="help">
          <b>Ти — володар підземелля.</b> Вибери монстра і посели його в нішу біля коридору.
          Клік по монстру — посилити або вигнати. Не дай авантюристам дістатися Серця.<br>
          <kbd>1</kbd>–<kbd>3</kbd> монстр · <kbd>Esc</kbd>/ПКМ скасувати ·
          <kbd>Enter</kbd> набіг · <kbd>Пробіл</kbd> пауза
        </section>
      </aside>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
