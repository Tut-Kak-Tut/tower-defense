<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Серце Підземелля</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <h1>Серце Підземелля</h1>
      <div class="stat souls" title="Душі — платиш ними за монстрів">👻 <span id="money"></span></div>
      <div class="stat heart" title="Міцність Серця">💜 <span id="lives"></span></div>
      <div class="stat raid" title="Набіг">⚔️ <span id="wave"></span></div>
      <button id="speedBtn" class="hud-btn" title="Швидкість гри"></button>
      <button id="autoBtn" class="hud-btn" title="Авто-набіг: наступний почнеться сам (A)"></button>
      <button id="pauseBtn" class="hud-btn" title="Пауза (Пробіл)"></button>
    </header>

    <main>
      <aside id="left">
        <section id="raidPanel">
          <h3 id="raidTitle"></h3>
          <div id="raidList"></div>
          <button id="waveBtn" class="primary"></button>
        </section>

        <section id="bestiary">
          <h3>Бестіарій</h3>
          <div id="bestiaryList"></div>
        </section>
      </aside>

      <div id="board">
        <canvas id="game" width="800" height="480"></canvas>
        <div id="overlay" class="hidden">
          <div class="panel">
            <h2 id="overlayTitle"></h2>
            <p id="overlayText"></p>
            <div class="overlay-btns">
              <button id="campaignBtn" class="primary">⚔️ Кампанія (100 набігів)</button>
              <button id="endlessBtn" class="primary">♾️ Безкінечний</button>
              <button id="continueBtn" class="primary">♾️ Продовжити безкінечно</button>
              <button id="restartBtn" class="primary">Грати знову</button>
              <button id="menuBtn">До меню</button>
            </div>
          </div>
        </div>
      </div>

      <aside id="right">
        <nav class="tabs">
          <button id="tabMonsters" class="tab">Монстри</button>
          <button id="tabUpgrade" class="tab">Посилення</button>
        </nav>

        <div class="window">
          <div id="paneMonsters">
            <div id="towerList"></div>
            <p class="help">
              <b>Ти — володар підземелля.</b> Вибери монстра і посели його в нішу біля коридору.
              Клік по монстру на полі — посилити або вигнати.<br>
              <kbd>1</kbd>–<kbd>7</kbd> монстр · <kbd>Esc</kbd>/ПКМ скасувати ·
              <kbd>Enter</kbd> набіг · <kbd>A</kbd> авто · <kbd>Пробіл</kbd> пауза
            </p>
          </div>

          <div id="paneUpgrade">
            <p id="upEmpty" class="help">Клікни по монстру на полі, щоб побачити, як його можна посилити.</p>
            <div id="upBody">
              <div class="up-head">
                <span id="upIcon"></span>
                <div>
                  <div id="upName"></div>
                  <div id="upLevel"></div>
                </div>
              </div>
              <p id="upDesc"></p>
              <table id="upStats"></table>
              <button id="upgradeBtn" class="primary"></button>
              <button id="sellBtn" class="danger"></button>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
